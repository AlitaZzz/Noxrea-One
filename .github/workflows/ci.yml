name: CI

on:
  push:
    branches: [main]
  pull_request:

# 阻塞式质量门禁：lint / typecheck / 全部测试（server + web）。
# 与 docker-publish 相互独立；后续可在分支保护中将其设为 required。
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # server 配置在 import 链上校验必填项（loadConfig），CI 无 gitignore 的 .env；
      # 这里注入仅用于单元测试的占位密钥（非生产凭据，schema 仅要求非空且非 change-me 占位符）
      JWT_SECRET_KEY: ci-unit-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test