# NAS 部署用：直接从 GitHub 容器仓库拉取现成镜像（无需在 NAS 上构建）
# 架构：三容器 —— PostgreSQL 17 + Redis 7（任务队列与分布式限流）+ 应用（web 3000 / api 4000）
# 数据持久化到 NAS 宿主机目录 /share/Container/noxreaone（PG 数据 + Redis AOF + 上传文件）
# 配置文件：首次启动前只需在 /share/Container/noxreaone/.env 写 POSTGRES_PASSWORD=... 与 REDIS_PASSWORD=...，
#           其余配置（JWT 密钥等）由容器首次启动自动生成；之后编辑该文件并重启容器即可修改
# 容器加入已存在的 mihomo_shared_network 共享网络（需先确保该网络已创建）
services:
  postgres:
    image: postgres:17-alpine
    container_name: noxrea-postgres
    environment:
      POSTGRES_USER: noxrea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 compose 同目录 .env 设置 POSTGRES_PASSWORD=...}
      POSTGRES_DB: noxrea
    # 2核2G 内存约束：shared_buffers 128MB、连接收敛、autovacuum 收敛
    command: >
      postgres -c shared_buffers=128MB -c max_connections=20
               -c work_mem=8MB -c maintenance_work_mem=64MB
               -c autovacuum_max_workers=2
    volumes:
      - /share/Container/noxreaone/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noxrea -d noxrea"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - mihomo_shared_network

  redis:
    image: redis:7-alpine
    container_name: noxrea-redis
    # 本应用专用实例（任务队列 + 分布式限流；specs/task-queue-bullmq.md 规则 7）：
    # - requirepass 必填（REDIS_PASSWORD 由 compose 同目录 .env 提供）
    # - appendonly yes + everysec：队列派发状态崩溃后可恢复
    # - maxmemory 256MB + noeviction：队列键被驱逐 = 派发丢失，宁可写失败（由
    #   DB 行 + 对账清扫兜底自愈），不可静默丢数据
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?请在 compose 同目录 .env 设置 REDIS_PASSWORD=...}
                   --appendonly yes --appendfsync everysec
                   --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - /share/Container/noxreaone/redisdata:/data
    ports:
      # 本地开发机与运维直达（内网）；不需要时删掉这两行，仅容器网络内可达
      - "9835:6379"
    healthcheck:
      # 密码为部署期插值（容器内无该环境变量）；-a 会在命令行可见，与 requirepass 同级别暴露面
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - mihomo_shared_network

  noxrea:
    image: ghcr.io/alitazzz/noxrea-one:latest
    container_name: noxrea-one
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 服务器模式：连接串指向 compose 内的 postgres 服务；
      # 迁移由 entrypoint 的 prisma migrate deploy 自动执行
      DATABASE_URL: postgres://noxrea:${POSTGRES_PASSWORD}@postgres:5432/noxrea
      # 单副本由 entrypoint 自动执行迁移；多副本部署设 RUN_MIGRATIONS=0 并用独立迁移 Job。
      # DATABASE_POOL_MAX 可选（默认 10），多副本按「副本数 × 该值 + 余量 ≤ max_connections」规划。
      # 任务队列（BullMQ）与分布式限流共用：指向 compose 内的 redis 服务；Redis 不可达时应用启动失败
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3000:3000"
    volumes:
      - /share/Container/noxreaone:/data
    restart: unless-stopped
    networks:
      - mihomo_shared_network

# 创建自定义网络，让所有使用自定义网络的容器之间可以通信
networks:
  mihomo_shared_network:
    external: true
