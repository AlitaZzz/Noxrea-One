services:
  noxrea:
    build:
      context: .
      dockerfile: Dockerfile
    image: noxrea-one:latest
    container_name: noxrea-one
    ports:
      - "3000:3000"
    volumes:
      - noxrea-data:/data
    # 环境变量统一从根目录 .env 读取（模板见 .env.example）
    env_file:
      - .env
    restart: unless-stopped

volumes:
  noxrea-data:
